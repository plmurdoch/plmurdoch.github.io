<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Portfolio responsive review</title>
<style>body{margin:20px;background:#e2e6e8;color:#18252e;font:14px Arial,sans-serif}h1{font-size:22px}p{line-height:1.6}main{display:flex;flex-wrap:wrap;align-items:start;gap:24px}h2{font-size:15px}iframe{border:1px solid #7a8a94;height:830px;background:#121b22}section{max-width:100%;overflow:auto}</style>

<body><h1>Portfolio responsive review</h1><p>Real page rendering inside independent viewport widths. Use each frame's navigation to review sections and keyboard behavior.</p><main>
<section><h2>320 px</h2><iframe id="phone-small" title="320 pixel portfolio" src="/" width="320"></iframe></section>
<section><h2>390 px</h2><iframe id="phone" title="390 pixel portfolio" src="/" width="390"></iframe></section>
<section><h2>768 px</h2><iframe id="tablet" title="768 pixel portfolio" src="/" width="768"></iframe></section>
<section><h2>1024 px</h2><iframe id="laptop" title="1024 pixel portfolio" src="/" width="1024"></iframe></section>
</main></body></html>
